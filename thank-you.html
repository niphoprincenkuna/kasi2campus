<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kasi2Campus | Thank You</title>
<link rel="icon" href="assets/logo-emblem.png" type="image/png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/style.css" />

<style>
  .status-wrap { min-height: calc(100vh - 158px); display:flex; align-items:center; justify-content:center; padding: 48px 20px; background: var(--bg-soft); }
  .status-card { background: var(--surface); border:1px solid var(--line); border-radius:20px; padding:48px 40px; max-width:480px; width:100%; text-align:center; box-shadow: 0 24px 60px -24px rgba(15,42,68,.25); animation: statusFadeUp .6s ease both; }
  .status-icon { width:92px; height:92px; border-radius:50%; margin:0 auto 22px; display:grid; place-items:center; background: var(--teal); animation: statusPop .5s cubic-bezier(.34,1.56,.64,1) .15s both; }
  .status-icon svg { width:44px; height:44px; }
  .status-icon svg path { fill:none; stroke:#fff; stroke-width:4; stroke-linecap:round; stroke-linejoin:round; stroke-dasharray:26; stroke-dashoffset:26; animation: statusDraw .5s ease .6s forwards; }
  .status-card h1 { font-size:1.6rem; font-weight:800; }
  .status-card p { margin-top:12px; }
  .status-actions { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; margin-top:24px; }

  @keyframes statusFadeUp { from{opacity:0; transform:translateY(18px);} to{opacity:1; transform:translateY(0);} }
  @keyframes statusPop { from{opacity:0; transform:scale(.4);} to{opacity:1; transform:scale(1);} }
  @keyframes statusDraw { to{ stroke-dashoffset:0; } }

  @media (prefers-reduced-motion: reduce) {
    .status-card, .status-icon, .status-icon svg path { animation: none !important; opacity:1 !important; transform:none !important; stroke-dashoffset:0 !important; }
  }
</style>
</head>

<body>

<header class="site-header">
  <nav class="navbar container" style="justify-content:space-between;">
    <a class="brand" href="index.html" aria-label="Kasi2Campus home">
      <img src="assets/logo-emblem.png" alt="Kasi2Campus logo" style="height:40px; width:auto;" />
      <span class="brand-name">Kasi<i>2</i>Campus</span>
    </a>
    <a class="btn btn-primary" href="apply.html">Continue</a>
  </nav>
</header>

<main>
  <section class="status-wrap">
    <div class="status-card">
      <div class="status-icon">
        <svg viewBox="0 0 24 24"><path d="M5 13l4 4L19 7"/></svg>
      </div>

      <h1>Thank you! 🎉</h1>
      <p class="muted" id="summary"></p>

      <div class="status-actions">
        <a class="btn btn-primary" href="apply.html">Continue to Apply</a>
        <a class="btn btn-ghost" id="waBtn" href="#" target="_blank" rel="noopener noreferrer">
          Message us on WhatsApp
        </a>
      </div>

      <p class="muted small" style="margin-top:16px;">
        Click &ldquo;Message us on WhatsApp&rdquo; to confirm your payment and start your application.
      </p>
    </div>
  </section>
</main>

<footer style="padding:24px 0;">
  <div class="container muted small" style="text-align:center;">© <span id="year"></span> Kasi2Campus. All rights reserved.</div>
</footer>

<script>
  const y = document.getElementById("year");
  if (y) y.textContent = new Date().getFullYear();

  const pkg = localStorage.getItem("k2c_selected_package") || "your package";
  const amount = localStorage.getItem("k2c_selected_amount") || "";
  const number = localStorage.getItem("k2c_whatsapp_number") || "27664687222";
  const msg = localStorage.getItem("k2c_whatsapp_message") || `Hi Kasi2Campus, I just paid for ${pkg}.`;

  document.getElementById("summary").textContent =
    amount ? `Payment received for ${pkg} (R${amount}). Let's continue with your application.` :
             `Payment received for ${pkg}. Let's continue with your application.`;

  const waUrl = `https://wa.me/${number}?text=${encodeURIComponent(msg)}`;
  document.getElementById("waBtn").href = waUrl;
</script>
</body>
</html>
